name: Release Please

# Release manager. On every push to main it maintains a release PR from Conventional Commits;
# merging that PR bumps the version, updates CHANGELOG.md and creates a GitHub release + tag. It is
# the only workflow that runs on push to main — and it is not a build: a plain feature merge just
# refreshes the release PR. The release itself is built/published by release-build.yml, which this
# workflow calls directly when a release is created (a GITHUB_TOKEN-created release would not trigger
# an `on: release` workflow, so we invoke it as a reusable workflow instead — no PAT required).
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write # passed through to release-build for npm provenance

# Serialize release/publish runs per ref; never cancel one mid-flight (cancel-in-progress: false).
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    # Hard cap so a hung job can't drain the Actions minute quota (metered on private repos).
    timeout-minutes: 15
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # When a release was just created, run the release build (build + publish). Calling the reusable
  # workflow here is what lets it fire — the release event created by GITHUB_TOKEN would not.
  release-build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    uses: ./.github/workflows/release-build.yml
    secrets: inherit
