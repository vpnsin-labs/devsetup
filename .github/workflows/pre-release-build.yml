name: Pre-release Build

# Validation build for the RELEASE-PLEASE pull request — the automated version-bump + CHANGELOG PR.
# Merging that PR cuts a release, so this proves the release candidate is green beforehand. It is a
# pull_request build (not a push build): merging it does not re-run this — release-build.yml takes
# over once the release is created.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pre-release-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check & build
    # Only the release-please PR; feature PRs are handled by pr-build.yml.
    if: ${{ startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    # Hard cap so a hung job can't drain the Actions minute quota (metered on private repos).
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check --if-present

      - name: Lint (ESLint)
        run: npm run lint --if-present

      - name: Lint (Markdown)
        run: npm run lint:md --if-present

      - name: Prettier check
        run: npm run format:check --if-present

      - name: Build
        run: npm run build --if-present

      - name: Test
        run: npm test --if-present
