# ~/.gradle/gradle.properties — applied to every Gradle project on this machine.
# Managed by devsetup. Re-run `npx @vpnsin-lab/devsetup --dotfiles` to reset.

# ── JVM memory ────────────────────────────────────────────────────────────────
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# ── Daemon (keeps JVM warm between builds) ────────────────────────────────────
org.gradle.daemon=true
org.gradle.daemon.idletimeout=10800000

# ── Parallel & caching ────────────────────────────────────────────────────────
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# ── Kotlin (if used) ──────────────────────────────────────────────────────────
kotlin.incremental=true
kotlin.daemon.jvm.options=-Xmx2g

# ── Android (if applicable) ───────────────────────────────────────────────────
android.useAndroidX=true
android.enableJetifier=false
android.enableR8.fullMode=false

# ── Corporate / Zscaler proxy ─────────────────────────────────────────────────
# Uncomment if behind a corporate proxy (Zscaler, Squid, etc.)
{{GRADLE_PROXY_LINES}}
